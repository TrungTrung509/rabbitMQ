services:
  mysqldb:
    image: mysql:8.0
    container_name: testmq_mysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testmq_db}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - testmq_mysql_data:/var/lib/mysql
    networks:
      - testmq_network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-123456}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: testmq_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysqldb
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testmq_db}
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      JWT_BASE64_SECRET: ${JWT_BASE64_SECRET}
      JWT_ACCESS_TOKEN_EXPIRATION: ${JWT_ACCESS_TOKEN_EXPIRATION:-900}
      JWT_REFRESH_TOKEN_EXPIRATION: ${JWT_REFRESH_TOKEN_EXPIRATION:-2592000}
    depends_on:
      mysqldb:
        condition: service_healthy
    networks:
      - testmq_network

  redis:
    image: redis:7-alpine
    container_name: testmq_redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - testmq_network

networks:
  testmq_network:
    driver: bridge

volumes:
  testmq_mysql_data:
  redis_data:
